# Type check, tests and build on Windows, macOS and Linux for every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Check the shell launchers
        if: runner.os != 'Windows'
        run: |
          bash -n start-aura.sh
          bash -n start-aura.command
          test -x start-aura.sh
          test -x start-aura.command
